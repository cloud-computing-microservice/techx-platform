name: Verify platform
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: platform-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  acceptance:
    uses: ./.github/workflows/ci-reusable.yml
  release:
    needs: acceptance
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AUTOMATION_ENABLED == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/release-staging.yml
    secrets: inherit
