name: Publish admitted cold-start images
run-name: ${{ inputs.dispatch_id != '' && format('TechX handoff {0}', inputs.dispatch_id) || github.workflow }}
on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: Reserved orchestration identity; leave blank for a manual cold publish
        default: ""
        required: false
        type: string
      session_id:
        description: Existing PROVISIONING staging session with foundation applied
        required: true
        type: string
      execution_version:
        description: Exact immutable S3 execution VersionId
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: staging-bootstrap-images
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1 && vars.LIFECYCLE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    environment: staging-bootstrap
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      TECHX_DISPATCH_ID: ${{ inputs.dispatch_id }}
      SESSION_ID: ${{ inputs.session_id }}
      EXECUTION_VERSION: ${{ inputs.execution_version }}
      INFRA_SHA: ${{ vars.AUTOMATION_INFRA_SHA }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          path: techx-platform
          persist-credentials: false
      - name: Validate typed existing-session and pinned automation inputs
        run: |
          python - <<'PY'
          import os, re
          assert re.fullmatch(r'staging-[A-Za-z0-9-]{1,64}', os.environ['SESSION_ID'])
          assert re.fullmatch(r'[A-Za-z0-9_./+=-]{1,1024}', os.environ['EXECUTION_VERSION'])
          assert re.fullmatch(r'[a-f0-9]{40}', os.environ['INFRA_SHA'])
          PY
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: cloud-computing-microservice/techx-infra
          ref: ${{ vars.AUTOMATION_INFRA_SHA }}
          path: techx-infra
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: techx-platform/package-lock.json
      - name: Install pinned automation SDK
        run: python -m pip install -r techx-infra/scripts/requirements-automation.txt
      - name: Configure cold publisher for existing ECR repositories
        uses: aws-actions/configure-aws-credentials@ce2ec50a23cfb8aacf5544bea7a651d803d626f6
        with:
          role-to-assume: ${{ vars.AWS_BOOTSTRAP_PUBLISHER_ROLE_ARN }}
          aws-region: us-east-1
          allowed-account-ids: "058114477594"
          role-session-name: techx-bootstrap-${{ github.run_id }}
          role-duration-seconds: 3600
      - name: Verify real source CI, claim heartbeat lease and cold publish exact archive
        env:
          CONTROL_BUCKET: ${{ vars.TECHX_STATE_BUCKET }}
          GITHUB_TOKEN: ${{ github.token }}
          LEASE_OWNER: ${{ github.repository }}:${{ github.run_id }}:${{ github.run_attempt }}
        run: |
          python techx-infra/scripts/run_bootstrap_publish.py --bucket="$CONTROL_BUCKET" \
            --session-id="$SESSION_ID" --execution-version="$EXECUTION_VERSION" --owner="$LEASE_OWNER"
      - name: Prepare chart intent with read-only GitHub access
        id: chart
        env:
          CONTROL_BUCKET: ${{ vars.TECHX_STATE_BUCKET }}
          GITHUB_TOKEN: ${{ github.token }}
          LEASE_OWNER: ${{ github.repository }}:${{ github.run_id }}:${{ github.run_attempt }}
        run: |
          python techx-infra/scripts/run_bootstrap_publish.py --bucket="$CONTROL_BUCKET" \
            --session-id="$SESSION_ID" --execution-version="$EXECUTION_VERSION" --owner="$LEASE_OWNER" --prepare-chart
      - name: Create scoped chart proposal token only for a real diff
        id: app
        if: steps.chart.outputs.proposal_kind == 'pull-request'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: cloud-computing-microservice
          repositories: techx-chart
          permission-contents: write
          permission-pull-requests: write
      - name: Propose exact cold manifest for chart CI and review
        if: steps.chart.outputs.proposal_kind == 'pull-request'
        env:
          CONTROL_BUCKET: ${{ vars.TECHX_STATE_BUCKET }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
          LEASE_OWNER: ${{ github.repository }}:${{ github.run_id }}:${{ github.run_attempt }}
        run: |
          python techx-infra/scripts/run_bootstrap_publish.py --bucket="$CONTROL_BUCKET" \
            --session-id="$SESSION_ID" --execution-version="$EXECUTION_VERSION" --owner="$LEASE_OWNER" --propose-chart
  notify:
    needs: publish
    if: always() && github.ref == 'refs/heads/main' && github.run_attempt == 1 && vars.LIFECYCLE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: staging-bootstrap
    permissions:
      contents: read
      actions: read
    steps:
      - name: Validate pinned callback helper revision
        env:
          INFRA_SHA: ${{ vars.AUTOMATION_INFRA_SHA }}
        run: |
          python - <<'PY'
          import os, re
          assert re.fullmatch(r'[a-f0-9]{40}', os.environ['INFRA_SHA'])
          PY
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: cloud-computing-microservice/techx-infra
          ref: ${{ vars.AUTOMATION_INFRA_SHA }}
          persist-credentials: false
      - name: Create infra-only lifecycle wakeup token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          app-id: ${{ vars.LIFECYCLE_APP_ID }}
          private-key: ${{ secrets.LIFECYCLE_APP_PRIVATE_KEY }}
          owner: cloud-computing-microservice
          repositories: techx-infra
          permission-actions: write
      - name: Wake existing session without selecting a lifecycle action
        env:
          SESSION_ID: ${{ inputs.session_id }}
          EXECUTION_VERSION: ${{ inputs.execution_version }}
          GITHUB_TOKEN: ${{ github.token }}
          LIFECYCLE_APP_TOKEN: ${{ steps.app.outputs.token }}
        run: python scripts/wake_lifecycle.py
